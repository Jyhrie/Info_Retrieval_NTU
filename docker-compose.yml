version: "3.9"

services:
  solr:
    image: solr:latest
    container_name: solr_node
    ports:
      - "8983:8983"
    environment:
      - SOLR_JAVA_MEM=-Xms512m -Xmx512m
    volumes:
      - ./data/solr:/var/solr
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - my_core_name  
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  solr_data:
    name: solr_data