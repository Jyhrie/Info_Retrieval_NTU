{% load crispy_forms_tags %}

<!DOCTYPE html>
<html>
<head>
    <title>My Site</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex vh-100">

        <!-- Left Sidebar -->
        <div class="bg-primary text-white p-3" style="width: 200px;">
            <h5>List</h5>
            <!-- Add list items here -->
        </div>

        <!-- Main Content -->
        <div class="flex-grow-1 d-flex align-items-center justify-content-center">
            <div class="text-center w-50">

                <h1 class="display-4 fw-bold mb-4">Info Retrieval</h1>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form|crispy }}
                    </div>
                    <button type="submit" class="btn btn-primary px-4">
                        Submit
                    </button>
                </form>

            </div>
        </div>

    </div>
</body>
</html>
