<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Opinion IR System{% endblock %}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        #wrapper {
            display: flex;
            width: 100%;
            align-items: stretch;
        }

        /* Sidebar Styling */
        #sidebar {
            min-width: 280px;
            max-width: 280px;
            background: #212529;
            color: #fff;
            transition: all 0.3s cubic-bezier(0.945, 0.020, 0.270, 0.665);
            position: relative;
            min-height: 100vh;
            box-shadow: 3px 0 10px rgba(0,0,0,0.1);
        }

        #sidebar.active {
            margin-left: -280px;
        }

        /* Sidebar Toggle Button (Pinned to Edge) */
        #sidebarCollapse {
            position: absolute;
            right: -40px;
            top: 20px;
            width: 40px;
            height: 40px;
            background: #212529;
            border: none;
            color: #fff;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
            z-index: 1000;
            outline: none;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            padding: 30px 20px;
            background: #1a1d20;
            border-bottom: 1px solid #343a40;
        }

        /* Sidebar Navigation Links */
        .nav-link {
            padding: 12px 20px;
            color: #adb5bd;
            transition: 0.2s;
            border-radius: 4px;
            margin: 4px 10px;
        }

        .nav-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-link.active {
            color: #fff;
            background-color: #007bff !important;
            font-weight: bold;
        }

        /* Content Area */
        #content {
            width: 100%;
            padding: 40px;
            min-height: 100vh;
            transition: all 0.3s;
        }

        /* Custom Sentiment Dots (Reusable Utility) */
        .sentiment-dot {
            height: 12px;
            width: 12px;
            border-radius: 50%;
            display: inline-block;
        }
    </style>
</head>
<body>

<div id="wrapper">
    <nav id="sidebar">
        <button type="button" id="sidebarCollapse">
            <i class="fas fa-bars"></i>
        </button>

        <div class="sidebar-header">
            <h4 class="mb-0 text-primary font-weight-bold">SC4021 IR Project</h4>
            <small class="text-muted"></small>
        </div>

        <ul class="nav flex-column mt-4">
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                    <i class="fas fa-home mr-3"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if 'search' in request.path %}active{% endif %}" href="/search/">
                    <i class="fas fa-search mr-3"></i> Search Index
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="fas fa-chart-line mr-3"></i> Analytics
                </a>
            </li>
        </ul>

        <div class="position-absolute w-100 p-4" style="bottom: 0; background: #1a1d20;">
            <small class="text-uppercase text-muted d-block mb-2">Dataset Info</small>
            <span class="badge badge-primary px-3 py-2">14,715 Records</span>
            <div class="text-success small mt-2">
                <i class="fas fa-check-circle mr-1"></i> Solr Connected
            </div>
        </div>
    </nav>

    <div id="content">
        {% block content %}
        {% endblock %}
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    $(document).ready(function () {
        $('#sidebarCollapse').on('click', function () {
            // Toggle sidebar visibility
            $('#sidebar').toggleClass('active');
            
            // Swap icon based on state
            const icon = $(this).find('i');
            if ($('#sidebar').hasClass('active')) {
                icon.removeClass('fa-bars').addClass('fa-chevron-right');
            } else {
                icon.removeClass('fa-chevron-right').addClass('fa-bars');
            }
        });
    });
</script>

</body>
</html>
