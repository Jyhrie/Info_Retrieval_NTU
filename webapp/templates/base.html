<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Opinion IR System{% endblock %}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        #wrapper {
            display: flex;
            width: 100%;
            align-items: stretch;
        }

        /* Sidebar */
        #sidebar {
            min-width: 220px;
            max-width: 220px;
            background: #1e2228;
            color: #fff;
            transition: all 0.25s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #sidebar.active {
            margin-left: -220px;
        }

        .sidebar-header {
            padding: 20px 16px 16px;
            background: #16191d;
            border-bottom: 1px solid #2c3038;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-header h5 {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            color: #4d9fff;
        }

        #sidebarCollapse {
            background: none;
            border: none;
            color: #adb5bd;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            line-height: 1;
        }

        #sidebarCollapse:hover { color: #fff; }

        .nav-link {
            padding: 10px 16px;
            color: #adb5bd;
            font-size: 14px;
            transition: 0.15s;
            border-radius: 4px;
            margin: 2px 8px;
        }

        .nav-link:hover {
            color: #fff;
            background: rgba(255,255,255,0.06);
        }

        .nav-link.active {
            color: #fff;
            background-color: #0069d9 !important;
            font-weight: 600;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid #2c3038;
            margin-top: auto;
        }

        /* Content */
        #content {
            width: 100%;
            padding: 32px 36px;
            min-height: 100vh;
            transition: all 0.25s;
        }
    </style>
</head>
<body>

<div id="wrapper">
    <nav id="sidebar">
        <div class="sidebar-header">
            <h5>SC4021 IR</h5>
            <button type="button" id="sidebarCollapse" title="Toggle sidebar">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <ul class="nav flex-column mt-3">
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                    <i class="fas fa-home mr-2"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if 'search' in request.path %}active{% endif %}" href="/search/">
                    <i class="fas fa-search mr-2"></i> Search Index
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="fas fa-chart-line mr-2"></i> Analytics
                </a>
            </li>
        </ul>

        <div class="sidebar-footer" style="margin-top:auto; padding:12px 16px; border-top:1px solid #2c3038;">
            <small class="text-uppercase text-muted d-block mb-1" style="font-size:11px;">Dataset</small>
            <span class="badge badge-primary">53,485 Records</span>
            <div class="text-success small mt-1">
                <i class="fas fa-check-circle mr-1"></i> Solr Connected
            </div>
        </div>
    </nav>

    <div id="content">
        {% block content %}
        {% endblock %}
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    $(document).ready(function () {
        $('#sidebarCollapse').on('click', function () {
            $('#sidebar').toggleClass('active');
        });
    });
</script>

</body>
</html>
